<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 20px; }
    .hidden { display: none; }

    .account { font-size: 12px; color: #999; margin-bottom: 4px; text-align: center; }
    .count { font-size: 36px; font-weight: 700; margin: 14px 0 4px; text-align: center; }
    .subtext { font-size: 12px; color: #999; margin-bottom: 14px; text-align: center; }
    .badge-wrap { text-align: center; }
    .badge { display: inline-block; background: #1a1a1a; border-radius: 20px; padding: 6px 14px; font-size: 12px; color: #ccc; margin-bottom: 18px; }
    .footer { font-size: 11px; color: #999; margin-top: 12px; text-align: center; }
    .rescan-link { display: block; width: 100%; text-align: center; font-size: 12px; color: #4f7cff; cursor: pointer; background: none; border: none; margin: 10px 0 0; padding: 0; }

    button { padding: 12px; font-size: 14px; border: none; border-radius: 6px; background: #4f7cff; color: white; cursor: pointer; }
    button:disabled { background: #333; cursor: default; }
    #scanButton { width: 100%; }

    h1 { font-size: 16px; margin: 0 0 12px; }
    .back { font-size: 12px; color: #4f7cff; cursor: pointer; background: none; border: none; padding: 0; margin-bottom: 12px; }
    .select-all { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #999; padding: 8px 0; border-bottom: 1px solid #333; cursor: pointer; }
    .row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #333; }
    .row .info { flex: 1; }
    .domain { font-size: 14px; font-weight: 600; }
    .meta { font-size: 12px; color: #999; }
    .trust { font-size: 12px; color: #4f7cff; cursor: pointer; background: none; border: none; padding: 0; }
    .confirm-bar { position: sticky; bottom: 0; background: #111; padding: 16px 0; }
    button.primary { width: 100%; padding: 12px 20px; font-size: 14px; }
    #status { font-size: 13px; color: #999; margin-top: 10px; }
  </style>
</head>
<body>
  <section id="digestView">
    <div class="account" id="account">Mail Cleaner</div>
    <div class="count" id="count">—</div>
    <div class="subtext" id="subtext">No scan yet</div>
    <div class="badge-wrap"><div class="badge" id="badge" style="display:none"></div></div>
    <button id="scanButton">Scan my inbox</button>
    <button class="rescan-link" id="rescanButton" style="display:none">Scan again</button>
    <div class="footer" id="lastScanned"></div>
  </section>

  <section id="reviewView" class="hidden">
    <button class="back" id="backButton">&larr; Back</button>
    <h1>Review flagged senders</h1>
    <label class="select-all"><input type="checkbox" id="selectAllCheckbox" checked> Select all</label>
    <div id="list"></div>
    <div class="confirm-bar">
      <button class="primary" id="confirmButton">Clean selected</button>
      <div id="status"></div>
    </div>
  </section>

  <script type="module" src="src/sidepanel.js"></script>
</body>
</html>
